name: 空投情报扫描
on:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时运行一次[reference:10]
  workflow_dispatch:  # 支持手动触发[reference:11]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests
      - run: python scanner/intel_scanner.py